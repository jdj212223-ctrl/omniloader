apply from: rootProject.file('gradle/omni/common.gradle')

// A plain NeoForge dev game for this Minecraft version. Everything it plays with comes from run*/mods:
// Omniloader plus the jars in testmods/<mc>/.
sourceSets.main.java.srcDirs = []
omniSources('devtools/java', 'devtools')
processResources { from(rootProject.file('devtools/resources')) }

neoForge {
    runs {
        client {
            client(); gameDirectory = file('run')
            systemProperty 'omniloader.titleShot', 'true'
            systemProperty 'omniloader.quitAfterShot', 'true'
        }
        server { server(); programArgument '--nogui'; gameDirectory = file('run-server') }
        clientJoin {
            client(); gameDirectory = file('run')
            programArguments.addAll('--quickPlayMultiplayer', '127.0.0.1:25598')
            systemProperty 'omniloader.joinShot', 'true'
        }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods { omnidevtools { sourceSet(sourceSets.main) } }
}

ext.loaderProject = project.path.replace(':devrun', ':loader')
def syncMods(String dir) {
    return { ->
        def mods = file("$dir/mods")
        mods.mkdirs()
        project.copy {
            from(project(loaderProject).tasks.jar.archiveFile)
            from(rootProject.file(project.findProperty("testmods") ?: "testmods/${project.mc_version}")) { include '*.jar' }
            into mods
        }
    }
}
tasks.register('syncClientMods') { dependsOn "${loaderProject}:jar"; doLast syncMods('run') }
tasks.register('syncServerMods') { dependsOn "${loaderProject}:jar"; doLast syncMods('run-server') }
afterEvaluate {
    tasks.named('runClient') { dependsOn 'syncClientMods' }
    tasks.named('runClientJoin') { dependsOn 'syncClientMods' }
    tasks.named('runServer') { dependsOn 'syncServerMods' }
}
