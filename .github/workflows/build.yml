# Builds Omniloader on every push to main and publishes a GitHub release with everything players need:
# the Mac installer (.dmg), the installer jar (Windows/Linux), the Omniloader jars and the engine.
name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest   # the .dmg needs macOS tools (hdiutil, iconutil)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21   # Gradle runs on 21; the 26.1 edition's Java 25 is fetched by Gradle itself

      - uses: gradle/actions/setup-gradle@v4

      - name: Build jars, installer and Mac installer
        run: ./gradlew --no-daemon :1.21.1:loader:jar :26.1:loader:jar :engine:jar :installer:jar :installer:macDmg

      - name: Collect release files
        id: files
        run: |
          VERSION=$(grep '^omni_version=' gradle.properties | cut -d= -f2)
          mkdir -p release
          cp versions/1.21.1/loader/build/libs/omniloader-1.21.1.jar release/
          cp versions/26.1/loader/build/libs/omniloader-26.1.jar release/
          cp engine/build/libs/omniloader-engine.jar release/
          cp installer/build/libs/omniloader-installer.jar release/
          cp "installer/build/mac/Omniloader-Installer-${VERSION}.dmg" release/
          ls -la release
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: omniloader-${{ steps.files.outputs.version }}-build${{ github.run_number }}
          path: release/*

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.files.outputs.version }}
        run: |
          TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          cat > notes.md <<NOTES
          Omniloader ${VERSION} (build ${GITHUB_RUN_NUMBER}), built automatically from ${GITHUB_SHA::7}.

          **Which file do I need?**
          - **Mac:** \`Omniloader-Installer-${VERSION}.dmg\`: open it and double-click *Omniloader Installer*.
          - **Windows / Linux:** \`omniloader-installer.jar\` (needs Java 17 or newer).
          - **Already have NeoForge 1.21.1?** Just put \`omniloader-1.21.1.jar\` in your mods folder.
          - \`omniloader-engine.jar\`: Omniloader's own engine (experimental, see the README).
          - \`omniloader-26.1.jar\`: for Minecraft 26.1 (NeoForge mods + simpler Fabric mods).
          NOTES
          gh release create "$TAG" release/* --title "Omniloader ${VERSION} (build ${GITHUB_RUN_NUMBER})" --notes-file notes.md --target "$GITHUB_SHA" --latest
