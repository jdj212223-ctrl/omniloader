plugins { id 'net.neoforged.moddev' version '2.0.148' }

base { archivesName = 'omniloader' }
neoForge {
    version = rootProject.neo_version
}

// The runtime (Fabric/Quilt API + entrypoint runner) is a normal NeoForge mod.
// We tuck it inside the loader jar; the loader unpacks it at game start.
configurations { embeddedRuntime }
dependencies { embeddedRuntime project(path: ':runtime', configuration: 'runtimeElements') }

jar {
    archiveVersion = ''
    dependsOn ':runtime:jar'
    from(configurations.embeddedRuntime.filter { it.name.startsWith('omniloader-runtime') }) {
        into 'META-INF/omniloader'
        rename { 'omniloader-runtime.jar' }
    }
    manifest.attributes(
        'Automatic-Module-Name': 'dev.omniloader.loader',
        'Implementation-Title': 'Omniloader',
        'Implementation-Version': project.version
    )
}
