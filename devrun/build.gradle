plugins { id 'net.neoforged.moddev' version '2.0.148' }

// A plain NeoForge dev game with no mod source of its own.
// Everything it plays with comes from run/mods: Omniloader plus the test mods.
neoForge {
    version = rootProject.neo_version
    runs {
        client {
            client(); gameDirectory = file('run')
            systemProperty 'omniloader.titleShot', 'true'
            systemProperty 'omniloader.quitAfterShot', 'true'
        }
        server { server(); programArgument '--nogui'; gameDirectory = file('run-server') }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods { omnidevtools { sourceSet(sourceSets.main) } }
}

def syncMods(String dir) {
    return { ->
        def mods = file("$dir/mods")
        mods.mkdirs()
        project.copy {
            from(project(':loader').tasks.jar.archiveFile)
            from(rootProject.file('testmods')) { include '*.jar' }
            into mods
        }
    }
}
tasks.register('syncClientMods') { dependsOn ':loader:jar'; doLast syncMods('run') }
tasks.register('syncServerMods') { dependsOn ':loader:jar'; doLast syncMods('run-server') }
afterEvaluate {
    tasks.named('runClient') { dependsOn 'syncClientMods' }
    tasks.named('runServer') { dependsOn 'syncServerMods' }
}
